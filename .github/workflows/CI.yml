# to build a docker image for devboard frontend and push to dockerhub
name: CI

on:
  push:
    branches: [master]
jobs:
  lint-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkouts the code
        uses: actions/checkout@v7
      - name: setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24  
      - name: installs dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps
      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          eslint-dir: frontend
  build-push:
    needs: [lint-code]
    runs-on: ubuntu-latest
    steps:
      - name: Checkouts the code
        uses: actions/checkout@v7
      - name: Docker being logged in
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build and push on ducker hub
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-fe-master:latest
      
      
    
