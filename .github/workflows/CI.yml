# to build a docker image for devboard frontend and push to dockerhub
name: CI

on:
  push:
    branches: [master]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkouts the code
        uses: actions/checkout@v7
      - name: Docker being logged in
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build and push on ducker hub
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/devboard-fe-master:latest
      
      
    
